app = "lyfeos-app"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node dist/release-migrate.js"

[env]
  NODE_ENV = "production"
  NODE_OPTIONS = "--max-old-space-size=384"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.ports]
    port = 443

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  # Keep Fly's routing decision tied to process liveness. `/api/ready`
  # deliberately verifies the database and can briefly queue behind a valid
  # burst of application queries; using it here made Fly withdraw the only
  # healthy machine and turn a recoverable dependency delay into an HTTP/2
  # outage for every request. External monitoring still checks `/api/ready`.
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
