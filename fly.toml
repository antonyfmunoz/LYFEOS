app = "lyfeos-app"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = ["node", "dist/release-migrate.js"]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.ports]
    port = 443

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/ready"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
