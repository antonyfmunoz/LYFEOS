name: Production monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Exercise the incident and recovery alert path"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  synthetic:
    name: Check LyfeOS public endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Verify readiness
        run: |
          if [ "${{ inputs.force_failure }}" = "true" ]; then
            echo "Intentional monitor failure for alert-path verification"
            exit 1
          fi
          body="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 https://lyfeos.net/api/ready)"
          test "$(printf '%s' "$body" | jq -r '.status')" = "ready"
      - name: Verify anonymous authentication boundary
        run: |
          status="$(curl --silent --show-error --retry 2 --retry-all-errors --max-time 20 --output /dev/null --write-out '%{http_code}' https://lyfeos.net/api/auth/me)"
          test "$status" = "401"
      - name: Open an incident when the monitor fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Incident] LyfeOS production synthetic monitor failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-monitor',
              per_page: 100,
            });
            if (!existing.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['incident', 'production-monitor'],
                body: `The synthetic monitor failed at ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
      - name: Close recovered monitor incidents
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: incidents } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-monitor',
              per_page: 100,
            });
            for (const incident of incidents) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Recovered automatically at ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: 'closed',
              });
            }
