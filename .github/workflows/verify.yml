name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: git diff --check
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=critical

  messages-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lyfeos_messages_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lyfeos_messages_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lyfeos_messages_ci
      SESSION_SECRET: lyfeos-messages-ci-only-session-secret
      FOOD_CATALOG_GATEWAY_URL: http://localhost:5998
      FOOD_CATALOG_GATEWAY_TOKEN: lyfeos-food-catalog-ci-only-token
      FOOD_CATALOG_LOOKUP_SIGNING_SECRET: lyfeos-food-catalog-ci-only-signing-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply the complete raw migration history
        shell: bash
        run: |
          psql --version
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done < <(printf '%s\n' migrations/*.sql | sort)
      - name: Build and prove release migration convergence
        shell: bash
        run: |
          export CLERK_SECRET_KEY="sk""_test_lyfeoslocalqualification000000000"
          export VITE_CLERK_PUBLISHABLE_KEY="pk""_test_bG9jYWwubHlmZW9zLmRldiQ="
          npm run build
          node dist/release-migrate.js
          second_pass="$(node dist/release-migrate.js)"
          if [ -n "$second_pass" ]; then
            echo "Release migration runner was not a no-op on its second pass:"
            echo "$second_pass"
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE umh_approval_requests, umh_audit_records, umh_outbox_events, umh_inbound_commands, umh_federation_installations CASCADE' >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM lyfeos_schema_migrations WHERE id = '0128_umh_outbox_leases'" >/dev/null
          node dist/release-migrate.js
          repaired_table_count="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*)
          FROM information_schema.tables
          WHERE table_schema = 'public'
            AND table_name IN ('umh_federation_installations', 'umh_inbound_commands', 'umh_approval_requests', 'umh_audit_records', 'umh_outbox_events');
          SQL
          )"
          repaired_lease_column_count="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*)
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = 'umh_outbox_events'
            AND column_name IN ('lease_token', 'leased_until');
          SQL
          )"
          test "$repaired_table_count" = "5"
          test "$repaired_lease_column_count" = "2"
          repaired_second_pass="$(node dist/release-migrate.js)"
          if [ -n "$repaired_second_pass" ]; then
            echo "Release migration drift repair was not a no-op on its second pass:"
            echo "$repaired_second_pass"
            exit 1
          fi
      - name: Exercise authenticated product and recovery journeys
        shell: bash
        env:
          NODE_ENV: production
          PORT: 5099
          LYFEOS_TEST_ENV: isolated
          LYFEOS_TEST_API_URL: http://127.0.0.1:5099
        run: |
          export CLERK_SECRET_KEY="sk""_test_lyfeoslocalqualification000000000"
          export VITE_CLERK_PUBLISHABLE_KEY="pk""_test_bG9jYWwubHlmZW9zLmRldiQ="
          server_log="$RUNNER_TEMP/lyfeos-messages-server.log"
          node dist/index.js >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5099/api/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "LyfeOS did not become ready. Server log:"
            cat "$server_log"
            exit 1
          fi

          test_status=0
          npx vitest run tests/api-messages-convergence.test.ts tests/api-transformation-intelligence.test.ts tests/api-thread-capability-focus.test.ts tests/api-mission-consequence-preflight.test.ts tests/api-health-insight-interpretations.test.ts tests/api-cross-domain-hypotheses.test.ts tests/api-gamification-contract.test.ts tests/api-ai-governance.test.ts tests/api-relationship-governance.test.ts tests/api-food-catalog.test.ts tests/api-spreadsheets.test.ts tests/api-tables-forms.test.ts tests/api-calendar-window.test.ts tests/api-calendar-offline-concurrency.test.ts tests/api-workflow-automation-recovery.test.ts tests/api-scheduled-automations.test.ts tests/api-project-lifecycle-recovery.test.ts tests/api-mission-source-convergence.test.ts tests/api-mission-provider-evidence.test.ts tests/api-data-rights.test.ts tests/api-product-analytics.test.ts tests/api-planning-context-amendments.test.ts tests/api-workspace-search-scale.test.ts tests/api-personal-finance.test.ts tests/db-distributed-rate-limit.test.ts || test_status=$?
          if [ "$test_status" -eq 0 ]; then
            npx vitest run tests/db-umh-federation-conformance.test.ts || test_status=$?
          fi
          if [ "$test_status" -ne 0 ]; then
            echo "Authenticated integration qualification failed. Server log:"
            cat "$server_log"
          fi
          exit "$test_status"
      - name: Rehearse logical backup and isolated restore
        shell: bash
        run: |
          backup="$RUNNER_TEMP/lyfeos-ci-backup.dump"
          restored_url="postgresql://postgres:postgres@127.0.0.1:5432/lyfeos_restore_ci"
          schema_fingerprint() {
            psql "$1" -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT md5(string_agg(signature, E'\n' ORDER BY signature))
          FROM (
            SELECT 'column|' || table_name || '|' || column_name || '|' || data_type || '|' || is_nullable || '|' || coalesce(column_default, '') AS signature
            FROM information_schema.columns
            WHERE table_schema = 'public'
            UNION ALL
            SELECT 'constraint|' || conrelid::regclass::text || '|' || conname || '|' || pg_get_constraintdef(oid, true)
            FROM pg_constraint
            WHERE connamespace = 'public'::regnamespace
            UNION ALL
            SELECT 'index|' || tablename || '|' || indexname || '|' || indexdef
            FROM pg_indexes
            WHERE schemaname = 'public'
          ) AS structure;
          SQL
          }
          source_fingerprint="$(schema_fingerprint "$DATABASE_URL")"
          source_migrations="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c 'SELECT string_agg(id, '"'"','"'"' ORDER BY id) FROM lyfeos_schema_migrations')"
          test "$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM lyfeos_schema_migrations')" = "123"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file="$backup"
          test -s "$backup"
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lyfeos_restore_ci' >/dev/null
          pg_restore --dbname="$restored_url" --no-owner --no-acl --exit-on-error "$backup"
          test "$(schema_fingerprint "$restored_url")" = "$source_fingerprint"
          test "$(psql "$restored_url" -At -v ON_ERROR_STOP=1 -c 'SELECT string_agg(id, '"'"','"'"' ORDER BY id) FROM lyfeos_schema_migrations')" = "$source_migrations"
          test "$(psql "$restored_url" -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM lyfeos_schema_migrations')" = "123"
