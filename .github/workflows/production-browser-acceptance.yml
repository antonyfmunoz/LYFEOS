name: Production browser acceptance

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Immutable LyfeOS source revision expected in production
        required: true
        type: string
      require_authenticated:
        description: Fail unless the protected production suite executes
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lyfeos-production-browser-acceptance
  cancel-in-progress: false

jobs:
  production-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      LYFEOS_ACCEPTANCE_BASE_URL: https://lyfeos.net
      LYFEOS_ACCEPTANCE_EMAIL: ${{ secrets.LYFEOS_ACCEPTANCE_EMAIL }}
      LYFEOS_ACCEPTANCE_PASSWORD: ${{ secrets.LYFEOS_ACCEPTANCE_PASSWORD }}
      LYFEOS_ACCEPTANCE_REQUIRE_AUTHENTICATED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated || 'false' }}
    steps:
      - name: Resolve deployed immutable source
        id: release
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
        run: |
          reported="$(curl --fail --silent --show-error https://lyfeos.net/api/release | jq -r '.sourceRevision')"
          [[ "$reported" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$REQUESTED_SOURCE" ] && [ "$REQUESTED_SOURCE" != "$reported" ]; then
            echo "Requested source $REQUESTED_SOURCE is not the deployed source $reported" >&2
            exit 1
          fi
          echo "source=$reported" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          # Run the reviewed harness from the workflow revision. Production
          # identity stays pinned independently through /api/release below.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Verify deployed immutable source
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ steps.release.outputs.source }}
          EXPECTED_HARNESS_SOURCE: ${{ github.sha }}
        run: |
          harness="$(git rev-parse HEAD)"
          reported="$(curl --fail --silent --show-error https://lyfeos.net/api/release | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const value=JSON.parse(body); process.stdout.write(value.sourceRevision || ""); });')"
          test -n "$reported"
          test "$harness" = "$EXPECTED_HARNESS_SOURCE"
          test "$reported" = "$EXPECTED_SOURCE"
      - name: Run production browser acceptance
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_ACCEPTANCE_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:browser
      - name: Run truthful Mission core-loop acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_ACCEPTANCE_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:core-loop
      - name: Run disposable production onboarding acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_ACCEPTANCE_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:onboarding
      - name: Run disposable production AI-memory acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_AI_MEMORY_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-ai-memory
      - name: Run disposable production Voice acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_VOICE_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-voice
      - name: Run disposable production Pattern Explorer acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_PATTERN_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-pattern-explorer
      - name: Run disposable production Personal Finance acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_FINANCE_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-personal-finance
      - name: Run disposable production Tables and Forms acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_TABLES_FORMS_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-tables-forms
      - name: Run disposable production Calendar acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_CALENDAR_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-calendar
      - name: Run disposable production Sheets acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_SHEETS_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-sheets
      - name: Run disposable production Canvas acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_CANVAS_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-canvas
      - name: Run disposable production Search acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_SEARCH_ACCEPTANCE_MODE: production
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_SEARCH_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-search
      - name: Run disposable production Messages acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_MESSAGES_ACCEPTANCE_MODE: production
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_MESSAGES_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-messages
      - name: Run disposable production Projects acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_PROJECTS_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:production-projects
      - name: Run disposable production Mission safety acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LYFEOS_TEST_API_URL: https://lyfeos.net
          LYFEOS_MISSION_SAFETY_MODE: production
          LYFEOS_ACCEPTANCE_SOURCE: ${{ steps.release.outputs.source }}
          LYFEOS_ACCEPTANCE_HARNESS_SOURCE: ${{ github.sha }}
          LYFEOS_MISSION_SAFETY_OUTPUT_DIR: ${{ runner.temp }}/lyfeos-browser-acceptance
        run: npm run acceptance:mission-safety
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lyfeos-production-browser-acceptance-${{ steps.release.outputs.source }}
          path: ${{ runner.temp }}/lyfeos-browser-acceptance
          if-no-files-found: error
          retention-days: 30
