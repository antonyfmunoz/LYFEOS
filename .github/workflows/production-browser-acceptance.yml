      - name: Run disposable production Personal Finance acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated }}
        env:
          LYFEOS_CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
